[workspace]
resolver = "2"
members = [
    "crates/voe-types",
    "crates/voe-mask",
    "crates/voe-storage-api",
    "crates/voe-repo-api",
    "crates/voe-fs",
    "crates/voe-plugin",
    "crates/voe-commands",
    "crates/voe-shell",
    "crates/voe-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
voe-types = { path = "crates/voe-types" }
voe-mask = { path = "crates/voe-mask" }
voe-storage-api = { path = "crates/voe-storage-api" }
voe-repo-api = { path = "crates/voe-repo-api" }
voe-fs = { path = "crates/voe-fs" }
voe-plugin = { path = "crates/voe-plugin" }
voe-commands = { path = "crates/voe-commands" }
voe-shell = { path = "crates/voe-shell" }

thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
libloading = "0.9"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
hex = "0.4"
toml = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
owo-colors = "4"
crossterm = "0.29"
